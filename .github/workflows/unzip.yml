name: Unzip
on: push
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o lib.zip
      - run: rm lib.zip
      - run: |
          git config user.name "samimd-cmd"
          git config user.email "samimd@bot.com"
          git add .
          git commit -m "unzip lib folder" || true
          git push
