name: Unzip
on: [push]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o plugins.zip
      - run: rm plugins.zip
      - run: rm -rf .github
      - run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add .
          git commit -m "unzip plugins" || true
          git push
